# Publishes the website in site/ (plus the app's Sounds/) to GitHub Pages whenever they change on main.
name: Website
on:
  push:
    branches: [main]
    paths: [site/**, Sounds/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Add the cat's sounds (the same recordings as the app)
        run: rm -rf site/sounds && cp -R Sounds site/sounds
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
